trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

stages:
  - stage: Build
    jobs:
      - job: MavenBuild
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              path: $(MAVEN_CACHE_FOLDER)
          - script: mvn -B -DskipTests package
            displayName: Build
          - script: mvn -B test
            displayName: Test
          - script: mvn -B verify -Pstatic-analysis
            displayName: Static Analysis
            continueOnError: true
          - script: mvn -B org.owasp:dependency-check-maven:check
            displayName: Security Scan
            continueOnError: true
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: target
              ArtifactName: app

  - stage: Container
    dependsOn: Build
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: DockerBuildPush
        steps:
          - task: Docker@2
            inputs:
              command: buildAndPush
              repository: $(azureContainerRegistry)/app
              dockerfile: Dockerfile
              tags: |
                $(Build.SourceVersion)
                latest

  - stage: Deploy
    dependsOn: Container
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - deployment: DeployAKS
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploy step — wire to AKS via helm/kubectl"
