; Supervisord master config for LAMA single-container image.
; Runs MongoDB + FastAPI backend + Nginx (serving React build + reverse-proxying /api).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------
; MongoDB 7 — local data on /data/db (mount a host volume here for persistence)
; ---------------------------------------------------------------
[program:mongodb]
command=/usr/bin/mongod --bind_ip 127.0.0.1 --port 27017 --dbpath /data/db --logpath /var/log/mongodb.log --logappend --quiet
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/mongodb.out.log
stderr_logfile=/var/log/mongodb.err.log
stopsignal=INT
stopwaitsecs=30

; ---------------------------------------------------------------
; FastAPI backend (LAMA API on internal :8001)
; ---------------------------------------------------------------
[program:backend]
command=/usr/local/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1 --proxy-headers --forwarded-allow-ips="*"
directory=/app/backend
autostart=true
autorestart=true
priority=20
startsecs=8
startretries=10
stopsignal=INT
stopwaitsecs=10
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/backend"
stdout_logfile=/var/log/backend.out.log
stderr_logfile=/var/log/backend.err.log

; ---------------------------------------------------------------
; Nginx — single public port (default 8382) serving:
;   /              → React build (static)
;   /api/*         → FastAPI on 127.0.0.1:8001 (long-poll friendly)
; ---------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/nginx.out.log
stderr_logfile=/var/log/nginx.err.log
