user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;        # tolerate large ZIP uploads
    proxy_buffering off;              # SSE / streaming friendly
    proxy_read_timeout 600s;          # background jobs may stream up to 10 min
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8382 default_server;
        listen [::]:8382 default_server;
        server_name _;

        # FastAPI backend (any /api/* request)
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # Health probe (proxied so /health works against the FastAPI service)
        location = /health {
            proxy_pass http://127.0.0.1:8001/api/health;
        }

        # React build (SPA) — everything else falls back to index.html
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # NEVER cache the SPA shell — it carries the content-hashed bundle
        # filenames. If it gets cached, the browser will keep loading an old
        # JS bundle even after the server has a newer one. The hashed assets
        # below are immutable so this costs essentially nothing.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
        }
        location = / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
            try_files /index.html =404;
        }

        # Cache static assets aggressively (filenames are content-hashed → safe)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
