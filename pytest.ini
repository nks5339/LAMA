[pytest]
# The repo had no pytest configuration at all before this file. Two of the
# defaults that implies were actively harmful:
#
#   * `asyncio_mode` was unset. pytest-asyncio is pinned only in
#     requirements-dev-macos.txt, not in the container's requirements.txt, so
#     whether an `@pytest.mark.asyncio` test actually ran depended on which
#     requirements file happened to be installed. When the plugin is absent the
#     coroutine is never awaited and the test passes without executing a single
#     assertion. Pinning the mode makes that a hard error instead of a silent
#     pass.
#
#   * No markers were registered, so there was no way to separate the eight
#     live-server suites from the in-process ones. See backend/tests/conftest.py.

testpaths = backend/tests
asyncio_mode = strict

markers =
    integration: requires a live backend over HTTP; skipped unless --run-integration
    network: reaches the public internet; skipped unless --run-network

# Surface un-awaited coroutines and unregistered marks rather than letting them
# pass quietly -- both failure modes hide tests that never really ran.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
